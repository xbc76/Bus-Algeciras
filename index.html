<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#5f6773;--bd:#dfe3e8;--past:#a0a7b2;--ac:#0a6fb8;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#101317;--card:#1b2027;--tx:#eceff3;--mut:#a3acb8;--bd:#2c333c;--past:#5b6470;--ac:#5db4ff;--acx:#07131f}}
:root[data-theme=claro]{color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#5f6773;--bd:#dfe3e8;--past:#a0a7b2;--ac:#0a6fb8;--acx:#fff}
:root[data-theme=oscuro]{color-scheme:dark;--bg:#101317;--card:#1b2027;--tx:#eceff3;--mut:#a3acb8;--bd:#2c333c;--past:#5b6470;--ac:#5db4ff;--acx:#07131f}
:root[data-theme=pizarra]{color-scheme:dark;--bg:#263238;--card:#31424a;--tx:#e6edf0;--mut:#a9bac1;--bd:#475b64;--past:#70848d;--ac:#80cbc4;--acx:#10262b}
:root[data-theme=crema]{color-scheme:light;--bg:#f6efdf;--card:#fffaf0;--tx:#3a2f20;--mut:#7a6a52;--bd:#e4d8bd;--past:#b3a487;--ac:#b5651d;--acx:#fff}
:root[data-theme=loto]{color-scheme:light;--bg:#fbeff4;--card:#fff9fb;--tx:#3d1f2f;--mut:#85576d;--bd:#f0cfdd;--past:#c79bb0;--ac:#c2185b;--acx:#fff}
:root[data-theme=bosque]{color-scheme:dark;--bg:#14211a;--card:#1d3025;--tx:#e3f0e6;--mut:#a3c2ac;--bd:#2f4a3a;--past:#62826e;--ac:#7ccf8f;--acx:#0c2014}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 4px;max-width:720px;margin:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px}.logo{height:52px;width:auto;flex:none}
h1{margin:0;line-height:1.05;display:flex;align-items:baseline;gap:8px}
.bus{font-size:24px;font-weight:800;letter-spacing:.05em}
.alg{font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;font-size:36px;font-weight:700;display:inline-block;transform:rotate(-4deg);transform-origin:left bottom;text-shadow:0 1px 1px rgba(0,0,0,.18)}.sub{color:var(--mut);font-size:14px}
select{font-size:15px;padding:7px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.nav{display:flex;gap:8px;padding:8px 16px;max-width:720px;margin:auto}
.nav button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:16px}
.nav button.on,.seg button.on,.t.n{background:var(--ac);color:var(--acx);border-color:transparent}
main{padding:4px 16px 28px;max-width:720px;margin:auto}
input{width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px}
.row{display:flex;gap:8px;margin-bottom:10px}.row .cb{flex:1}
.btn{padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:10px}
.it,.ddi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.it small,.ddi small{color:var(--mut);display:block;font-size:14px}
.dn{opacity:.45}
.ch{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:14px;padding:2px 7px;border-radius:6px;margin-right:3px}
.t{font-variant-numeric:tabular-nums;font-size:16px;padding:4px 8px;border-radius:6px;border:1px solid var(--bd);display:inline-block;margin:3px}
.t.p{color:var(--past);text-decoration:line-through;border-color:transparent}
.t.n{font-weight:700}
.nx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.nx:last-child{border:0}.nx b{white-space:nowrap}
.mut{color:var(--mut);font-size:14px}
h3{margin:16px 0 6px;font-size:17px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 16px;font-weight:700;font-size:16px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:10px 4px;font-size:14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);line-height:1.25}
.sw{display:block;margin:0 auto 10px}
.cb{position:relative}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;max-height:50vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:min(720px,100%);max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:600}
.mb{overflow:auto;padding:6px 16px 16px}
.mr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:16px;cursor:pointer}
.mr b{font-variant-numeric:tabular-nums;min-width:50px}.mr .nm{flex:1}.mr.past{color:var(--past)}.mr.cur{border-left:4px solid var(--ac);padding-left:8px}
.mr .ch{font-size:12px;min-width:22px;padding:1px 5px}
a{color:var(--ac)}
</style>

 const n=now(),ts=N.map((t,i)=>[t,i]).filter(([t])=>t.l==selL&&t.d==selD).sort((a,b)=>a[0].st[0][1]-b[0].st[0][1]);
 const f=selD==2?-1:ts.findIndex(([t])=>t.st[0][1]>=n);
 if(!ts.length)h+='<div class="mut">No hay trayectos en este apartado.</div>';
 ts.forEach(([t,i],k)=>{const s0=t.st[0],e=t.st[t.st.length-1],done=e[1]<n,run=!done&&s0[1]<n;
  h+='<div class="it'+(done?' dn':'')+'" data-o="'+i+'" style="'+(k==f||run?'border-color:var(--ac)':'')+'"><div><b>'+hm(s0[1])+'</b> '+sn(s0[0])+' → '+sn(e[0])+'<small>'+t.st.length+' paradas · llega '+hm(e[1])+(done?' · terminado':run?' · en curso':k==f?' · próximo':'')+'</small></div></div>'});
 return h;
}
function field(f,sel,v,ph){
 if(sel!==null)return'<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><span class="mut">'+ph+'</span><br><b>'+sn(sel)+'</b></div><button class="btn" data-clr="'+f+'">✕</button></div>';
 return'<div class="mut" style="margin-bottom:4px">'+ph+'</div><div style="margin-bottom:8px">'+combo("q"+f,v,"Toca para elegir parada…")+'</div>'}
function plan(a,b){
 const n=now(),res=[],tr=[];let direct=false,first=null;
 N.forEach(t=>{if(t.sv)return;const ia=t.st.findIndex(x=>x[0]==a),ib=t.st.findIndex(x=>x[0]==b);
  if(ia>=0&&ib>ia){direct=true;const o={l:t.l,d:t.st[ia][1],a:t.st[ib][1]};if(first===null||o.d<first)first=o.d;if(o.d>=n)res.push(o)}});
 res.sort((x,y)=>x.d-y.d);
 if(!direct)N.forEach(t1=>{if(t1.sv)return;const ia=t1.st.findIndex(x=>x[0]==a);if(ia<0||t1.st[ia][1]<n)return;let best=null;
  for(let k=ia+1;k<t1.st.length;k++){const[x,m1]=t1.st[k];
   for(const[m2,ti]of byStop[x]){if(m2<m1+2)continue;const t2=N[ti];if(t2.l==t1.l)continue;
    const j=t2.st.findIndex(y=>y[0]==x),ib=t2.st.findIndex(y=>y[0]==b);
    if(j>=0&&ib>j){if(!best||t2.st[ib][1]<best.arr)best={l1:t1.l,l2:t2.l,dep:t1.st[ia][1],x,m1,m2,arr:t2.st[ib][1]};break}}}
  if(best)tr.push(best)});
 tr.sort((p,q)=>p.dep-q.dep||p.arr-q.arr);
 const uniq=[];tr.forEach(o=>{if(!uniq.some(u=>u.l1==o.l1&&u.x==o.x&&u.m2==o.m2))uniq.push(o)});
 return{direct,res,first,tr:uniq}}
function abView(){
 let h='<div class="mut" style="margin-bottom:8px">Calcula el trayecto entre dos paradas con los horarios programados (directo o con un transbordo en la misma parada). Las paradas son distintas en cada sentido.</div>'+field("a",pa,qa,"Parada de salida");
 h+='<button class="btn sw" data-swap="1">⇅ Intercambiar</button>'+field("b",pb,qb,"Parada de llegada");
 if(pa===null||pb===null)return h;
 if(pa==pb)return h+'<div class="mut">Elige dos paradas distintas.</div>';
 const n=now(),r=plan(pa,pb);h+='<h3>Resultados</h3>';
 if(r.res.length){h+='<div class="card">'+r.res.slice(0,8).map(o=>'<div class="nx"><div>'+chip(o.l)+' '+hm(o.d)+' → '+hm(o.a)+' <span class="mut">('+(o.a-o.d)+' min)</span></div><b class="mut">'+(o.d==n?"ahora":"en "+fmt(o.d-n))+'</b></div>').join("")+'</div>'}
 else if(r.direct)h+='<div class="card">No quedan servicios directos hoy. El primero de mañana sale a las '+hm(r.first)+'.</div>';
 else if(r.tr.length){h+='<div class="card">'+r.tr.slice(0,5).map(o=>'<div class="nx"><div>'+chip(o.l1)+' '+hm(o.dep)+' → baja en <b>'+sn(o.x)+'</b> ('+hm(o.m1)+')<br>'+chip(o.l2)+' '+hm(o.m2)+' → llegas '+hm(o.arr)+' <span class="mut">('+fmt(o.arr-o.dep)+' en total)</span></div><b class="mut">'+(o.dep==n?"ahora":"en "+fmt(o.dep-n))+'</b></div>').join("")+'</div><div class="mut">Transbordo en la misma parada, con al menos 2 min de margen.</div>'}
 else h+='<div class="card">No hay conexión directa ni con un transbordo entre estas paradas.</div>';
 return h}
// Ventana con el recorrido
function openTrip(i){
 const t=N[i],n=now(),e=t.st[t.st.length-1];let cur=true;
 const rows=t.st.map(([si,m])=>{const past=m<n,c=!past&&cur;if(c)cur=false;
  const oc=lines(si).filter(x=>x!=t.l).map(chip).join("");
  return'<div class="mr'+(past?" past":"")+(c?" cur":"")+'"'+(c?' id="cur"':'')+' data-s="'+si+'" data-go="1"><b>'+hm(m)+'</b><span class="nm">'+sn(si)+'</span><span>'+oc+'</span></div>'}).join("");
 document.getElementById("mdl").innerHTML='<div class="ov"><div class="md"><div class="mh"><div>'+chip(t.l)+hm(t.st[0][1])+' '+sn(t.st[0][0])+' → '+sn(e[0])+'<div class="mut">'+t.st.length+' paradas · toca una para ver sus horarios</div></div><button class="btn" data-close="1">✕</button></div><div class="mb">'+rows+'</div></div></div>';
 document.body.style.overflow="hidden";
 const c=document.getElementById("cur");if(c&&c.scrollIntoView)c.scrollIntoView({block:"center"})}
function closeTrip(){document.getElementById("mdl").innerHTML="";document.body.style.overflow=""}
function render(){
 const d=new Date();document.getElementById("clock").textContent=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})+" · "+pad(d.getHours())+":"+pad(d.getMinutes());
 bp.className=tab=="p"?"on":"";bl.className=tab=="l"?"on":"";ba.className=tab=="a"?"on":"";
 const act=document.activeElement&&document.activeElement.id||"",M=document.getElementById("main");
 M.innerHTML=(tab=="p"?stopView():tab=="l"?lineView():abView())+'<div class="mut" style="margin-top:14px">Datos de transporte.algesa.org (horarios programados). Ignora laborables/festivos: confirma en la web oficial. Datos completos de las líneas 1, 2, 3, 4, 5, 6 y 10.</div>';
 ["q","qa","qb"].forEach(id=>{const el=document.getElementById(id);if(!el)return;
  el.oninput=e=>{const v=e.target.value;if(id=="q"){q=v;near=null;msg="";selS=null}else if(id=="qa")qa=v;else qb=v;dd=id;render()};
  el.onfocus=()=>{if(dd!==id){dd=id;render();const x=document.getElementById(id);if(x&&x.select)x.select()}};
  if(act==id){el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
 const nb=document.getElementById("nb");if(nb)nb.onclick=()=>{msg="Buscando tu ubicación…";dd=null;render();
  if(!navigator.geolocation){msg="Tu navegador no permite la ubicación.";return render()}
  navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude;
   near=S.map((s,i)=>{const dx=(s[3]-lo)*Math.cos(la*Math.PI/180)*111320,dy=(s[2]-la)*111320;return[i,Math.hypot(dx,dy)]}).filter(x=>S[x[0]][2]).sort((a,b)=>a[1]-b[1]).slice(0,8);msg="";selS=null;render()},
   ()=>{msg="No se pudo obtener tu ubicación (permiso denegado o no disponible).";render()},{timeout:8000})};
}
document.addEventListener("click",e=>{
 const c=x=>e.target.closest&&e.target.closest(x);let el;
 if(dd&&!c(".cb")){dd=null;render()}
 if(el=c("[data-close]"))closeTrip();
 else if(e.target.classList&&e.target.classList.contains("ov"))closeTrip();
 else if(el=c("[data-pick]")){const id=el.dataset.pick,i=+el.dataset.i;dd=null;
  if(id=="q"){selS=i;q=sn(i);near=null}else if(id=="qa"){pa=i;qa=""}else{pb=i;qb=""}render()}
 else if(el=c("[data-clr]")){if(el.dataset.clr=="a")pa=null;else pb=null;render()}
 else if(c("[data-swap]")){[pa,pb]=[pb,pa];render()}
 else if(c("[data-pa]")){pa=selS;tab="a";render();window.scrollTo(0,0)}
 else if(c("[data-pb]")){pb=selS;tab="a";render();window.scrollTo(0,0)}
 else if(el=c("[data-s]")){selS=+el.dataset.s;q=sn(selS);near=null;if(el.dataset.go){closeTrip();tab="p"}render();window.scrollTo(0,0)}
 else if(el=c("[data-l]")){selL=el.dataset.l;selD=0;render()}
 else if(el=c("[data-d]")){selD=+el.dataset.d;render()}
 else if(el=c("[data-o]"))openTrip(+el.dataset.o);
});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){closeTrip();if(dd){dd=null;render()}}});
bp.onclick=()=>{tab="p";dd=null;render()};bl.onclick=()=>{tab="l";dd=null;render()};ba.onclick=()=>{tab="a";dd=null;render()};
render();setInterval(()=>{if(!/^q/.test(document.activeElement.id||""))render()},30000);
</script>
</body>
