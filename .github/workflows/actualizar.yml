name: Actualizar horarios

on:
  schedule:
    - cron: "30 3 * * *"   # cada día a las 03:30 UTC (04:30 o 05:30 en Algeciras)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar horarios
        run: |
          python3 - <<'PY'
          import json, re, time, sys, urllib.request, urllib.error
          from html.parser import HTMLParser
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASE = "https://transporte.algesa.org/"
          LINES = ["000001", "000002", "000003", "000004", "000005", "000006", "000010"]
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                "Accept-Language": "es-ES,es;q=0.9"}

          def get(path, tries=6):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(BASE + path, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504):
                          time.sleep(min(60, 8 * (i + 1)))
                          continue
                      raise
                  except Exception:
                      time.sleep(5 * (i + 1))
              raise RuntimeError("No se pudo leer " + path)

          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items, self.cur = [], None
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      m = re.search(r"[?&;]t=(\d+)", dict(attrs).get("href") or "")
                      self.cur = [m.group(1), ""] if m else None
              def handle_data(self, d):
                  if self.cur is not None:
                      self.cur[1] += d
              def handle_endtag(self, tag):
                  if tag == "a" and self.cur:
                      self.items.append((self.cur[0], re.sub(r"\s+", " ", self.cur[1]).strip()))
                      self.cur = None

          def b36(n):
              s = ""
              while True:
                  s = "0123456789abcdefghijklmnopqrstuvwxyz"[n % 36] + s
                  n //= 36
                  if n == 0:
                      break
              return s.rjust(3, "0")

          def build(items, ids, date):
              ok = [x for x in items if x.get("s")]
              clean = lambda n: re.sub(r"\s+", " ", n.split(":")[0]).strip()
              cochera = lambda x: bool(re.search(r"(Inicio|Fin)\s+(de\s+)?servicio", x["label"], re.I)) \
                  or bool(re.match(r"(cochera|instalaciones)", x["s"][0][1].strip(), re.I)) \
                  or bool(re.match(r"(cochera|instalaciones)", x["s"][-1][1].strip(), re.I))
              dirs, labels = {}, {}
              for l in sorted(set(x["l"] for x in ok)):
                  reg = [x for x in ok if x["l"] == l and not cochera(x)]
                  if not reg:
                      continue
                  key = lambda x: (x["s"][0][1].strip(), x["s"][-1][1].strip())
                  pc = {}
                  for x in reg:
                      pc[key(x)] = pc.get(key(x), 0) + 1
                  order = sorted(pc.items(), key=lambda kv: -kv[1])
                  P1 = order[0][0]
                  rev = (P1[1], P1[0])
                  P2 = rev if rev in pc else next((k for k, v in order if k != P1), P1)
                  D1 = set(s[0] for x in reg if key(x) == P1 for s in x["s"])
                  D2 = set(s[0] for x in reg if key(x) == P2 for s in x["s"])
                  e1, e2 = D1 - D2, D2 - D1
                  labels[l.lstrip("0")] = [clean(P1[0]), clean(P1[1])]
                  for x in reg:
                      c = set(s[0] for s in x["s"])
                      a, b = len(c & e1), len(c & e2)
                      dirs[x["t"]] = 0 if a > b else 1 if b > a else (0 if x["s"][0][1].strip() == P1[0] else 1)
              stops, order_s, seen, trips = {}, [], set(), []
              def sid(c, n, la, lo):
                  if c not in stops:
                      stops[c] = len(order_s)
                      order_s.append([c, re.sub(r"\s+", " ", n).strip(), round(la or 0, 5), round(lo or 0, 5)])
                  return stops[c]
              for x in ok:
                  k = (x["l"], tuple((s[0], s[2]) for s in x["s"]))
                  if k in seen:
                      continue
                  seen.add(k)
                  prev, off, p = -1, 0, ""
                  for c, n, h, la, lo in x["s"]:
                      m = re.match(r"(\d+):(\d+)", h or "")
                      if not m:
                          continue
                      mi = int(m[1]) * 60 + int(m[2]) + off
                      if mi < prev - 600:
                          off += 1440
                          mi += 1440
                      prev = mi
                      p += b36(sid(c, n, la, lo)) + str(mi).rjust(4, "0")
                  trips.append([x["l"].lstrip("0"), 2 if cochera(x) else dirs[x["t"]], p])
              return {"s": order_s, "t": trips, "L": labels, "date": date, "ids": ids}

          def main():
              hoy = datetime.now(ZoneInfo("Europe/Madrid")).strftime("%Y-%m-%d")
              found = {}
              for l in LINES:
                  for p in ("lineas-trayectos", "paradas-trayectos"):
                      try:
                          a = Anchors()
                          a.feed(get(p + ".php?l=" + l))
                      except Exception as e:
                          print("Aviso: no se pudo leer", p, l, e)
                          continue
                      for t, label in a.items:
                          found[t] = {"l": l, "t": t, "label": label}
                      time.sleep(1)
                  print("Línea", l, "->", sum(1 for v in found.values() if v["l"] == l), "trayectos")
              ids = sorted(found)
              if len(ids) < 50:
                  sys.exit("ERROR: se encontraron muy pocos trayectos (%d)." % len(ids))
              items, fail = [], 0
              for i, t in enumerate(ids):
                  try:
                      j = json.loads(get("includes/comboTrayectos.php?IdModeloServicioDetalle=" + t))
                      d = j.get("data") or []
                      if not d:
                          raise ValueError("vacío")
                      x = dict(found[t])
                      x["s"] = [[p["codigoParada"], p["nombreParada"], p["hora"], p["latitud"], p["longitud"]] for p in d]
                      items.append(x)
                  except Exception as e:
                      fail += 1
                      print("Fallo trayecto", t, e)
                  time.sleep(1)
                  if (i + 1) % 50 == 0:
                      print((i + 1), "/", len(ids))
              if fail > len(ids) * 0.03:
                  sys.exit("ERROR: fallaron demasiados trayectos (%d de %d)." % (fail, len(ids)))
              new = build(items, ids, hoy)
              try:
                  old = json.load(open("data.json", encoding="utf-8"))
              except Exception:
                  old = None
              if old:
                  if len(new["t"]) < 0.7 * len(old["t"]):
                      sys.exit("ERROR: hay muchos menos trayectos que antes; no se sobrescribe.")
                  if old["t"] == new["t"] and old["s"] == new["s"] and old["L"] == new["L"]:
                      new["date"] = old["date"]
              json.dump(new, open("data.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              open("ultima-comprobacion.txt", "w").write(datetime.now(ZoneInfo("Europe/Madrid")).strftime("%Y-%m-%d %H:%M") + "\n")
              print("OK:", len(new["t"]), "trayectos,", len(new["s"]), "paradas,", fail, "fallidos. Fecha de datos:", new["date"])

          if __name__ == "__main__":
              main()
          PY
      - name: Guardar cambios
        run: |
          git config user.name "horarios-bot"
          git config user.email "horarios-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Actualizar horarios $(date -u +%F)" && git push)
